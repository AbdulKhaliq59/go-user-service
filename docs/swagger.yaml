basePath: /api/v1
definitions:
  models.ExpectedTransactionRequest:
    properties:
      revenue:
        type: number
      transactions:
        type: integer
    required:
    - revenue
    - transactions
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://www.example.com/support
  description: A backend service written in Go with Gin framework
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: LONDONWINNER
  version: "1.0"
paths:
  /report/daily-transaction-report:
    get:
      consumes:
      - application/json
      description: Get detailed daily transaction report for the last 30 days
      produces:
      - application/json
      responses: {}
      summary: Get daily transaction report
      tags:
      - Report
  /report/daily-transactions:
    get:
      consumes:
      - application/json
      description: Retrieves transaction statistics for the current day
      produces:
      - application/json
      responses:
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get daily transaction statistics
      tags:
      - Report
  /report/draw:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses: {}
      security:
      - Bearer: []
      summary: Get daily transaction report
      tags:
      - Report
  /report/expected-transaction:
    post:
      consumes:
      - application/json
      description: Stores expected revenue and transaction count
      parameters:
      - description: Expected Transaction Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ExpectedTransactionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Add an expected transaction
      tags:
      - Report
  /report/general:
    get:
      consumes:
      - application/json
      description: Generate a general report for the given date range
      parameters:
      - description: From date (YYYY-MM-DD)
        in: query
        name: fromDate
        required: true
        type: string
      - description: To date (YYYY-MM-DD)
        in: query
        name: toDate
        required: true
        type: string
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Generate general report
      tags:
      - Report
  /report/hourly-transaction-report:
    get:
      consumes:
      - application/json
      description: Get detailed hourly transaction report for a specific date
      parameters:
      - description: Date in YYYY-MM-DD format
        in: query
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Get hourly transaction report
      tags:
      - Report
  /report/monthly:
    get:
      consumes:
      - application/json
      description: Generate revenue and transaction statistics grouped by month
      produces:
      - application/json
      responses:
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Generate monthly report
      tags:
      - Report
  /report/monthly-transaction-report:
    get:
      consumes:
      - application/json
      description: Get detailed monthly transaction report for the last 12 months
      produces:
      - application/json
      responses: {}
      summary: Get monthly transaction report
      tags:
      - Report
  /report/product-daily-transaction-report:
    get:
      consumes:
      - application/json
      description: Get detailed daily transaction report filtered by product and date
      parameters:
      - description: Product ID (UUID)
        in: query
        name: productId
        type: string
      - description: Date (YYYY-MM-DD)
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses: {}
      summary: Get daily transaction report by product
      tags:
      - Report
  /report/product-hourly-transaction-report:
    get:
      consumes:
      - application/json
      description: Get detailed hourly transaction report filtered by product and
        date range
      parameters:
      - description: Product ID (UUID)
        in: query
        name: productId
        type: string
      - description: Date (YYYY-MM-DD)
        in: query
        name: date
        type: string
      - description: From Date (YYYY-MM-DD HH:mm:ss)
        in: query
        name: fromDate
        type: string
      - description: To Date (YYYY-MM-DD HH:mm:ss)
        in: query
        name: toDate
        type: string
      - description: Order by clause (e.g., tot_successful_trx_amount DESC)
        in: query
        name: orderBy
        type: string
      produces:
      - application/json
      responses: {}
      summary: Get hourly transaction report by product
      tags:
      - Report
  /report/product-monthly-transaction-report:
    get:
      consumes:
      - application/json
      description: Get detailed monthly transaction report filtered by product
      parameters:
      - description: Product ID (UUID)
        in: query
        name: productId
        type: string
      produces:
      - application/json
      responses: {}
      summary: Get monthly transaction report by product
      tags:
      - Report
  /report/top-ten:
    get:
      consumes:
      - application/json
      description: Retrieves the top 10 transactions based on total transaction amount
      produces:
      - application/json
      responses:
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get top 10 transactions
      tags:
      - Report
  /report/top-ten/recent:
    get:
      consumes:
      - application/json
      description: Retrieves the top 10 most recent successful transactions
      produces:
      - application/json
      responses:
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Get top 10 recent successful transactions
      tags:
      - Report
  /report/transaction:
    get:
      consumes:
      - application/json
      description: Generate a transaction report for the given date range, optionally
        filtered by product ID and status
      parameters:
      - description: From date (YYYY-MM-DD)
        in: query
        name: fromDate
        required: true
        type: string
      - description: To date (YYYY-MM-DD)
        in: query
        name: toDate
        required: true
        type: string
      - description: Product ID
        in: query
        name: productId
        type: string
      - description: Transaction status (PENDING, FAILED, SUCCESS)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Generate transaction report
      tags:
      - Report
  /report/weekly:
    get:
      consumes:
      - application/json
      description: Generate revenue and transaction statistics grouped by week
      produces:
      - application/json
      responses:
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Generate weekly report
      tags:
      - Report
securityDefinitions:
  Bearer:
    description: Type "Bearer" followed by a space and JWT token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
