paths:
  /api/v1/blacklist:
    get:
      consumes:
      - application/json
      description: Retrieves all blacklist entries with pagination
      parameters:
      - description: Page number
        in: query
        name: pageNumber
        type: integer
      - description: Page size
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.Response'
      security:
      - ApiKeyAuth: []
      summary: Get blacklist entries
      tags:
      - Blacklist
    post:
      consumes:
      - application/json
      description: Adds a new entry to the blacklist
      parameters:
      - description: Blacklist entry details
        in: body
        name: blacklist
        required: true
        schema:
          $ref: '#/definitions/dto.CreateBlacklistDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.Response'
      security:
      - ApiKeyAuth: []
      summary: Create a new blacklist entry
      tags:
      - Blacklist
  /api/v1/blacklist/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a blacklist entry by its ID
      parameters:
      - description: Blacklist ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.Response'
      security:
      - ApiKeyAuth: []
      summary: Delete blacklist entry
      tags:
      - Blacklist
    get:
      consumes:
      - application/json
      description: Retrieves a blacklist entry by its ID
      parameters:
      - description: Blacklist ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.Response'
      security:
      - ApiKeyAuth: []
      summary: Get blacklist entry by ID
      tags:
      - Blacklist
    put:
      consumes:
      - application/json
      description: Updates an existing blacklist entry
      parameters:
      - description: Blacklist ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated blacklist details
        in: body
        name: blacklist
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateBlacklistDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.Response'
      security:
      - ApiKeyAuth: []
      summary: Update blacklist entry
      tags:
      - Blacklist
  /api/v1/group:
    get:
      consumes:
      - application/json
      description: Get all groups with their roles
      parameters:
      - description: Page number
        in: query
        name: pageNumber
        type: integer
      - description: Page size
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.PaginationResponse'
      summary: Get all groups
      tags:
      - Groups
    post:
      consumes:
      - application/json
      description: Create a new group
      parameters:
      - description: Group data
        in: body
        name: group
        required: true
        schema:
          $ref: '#/definitions/dto.CreateGroupDTO'
      produces:
      - application/json
      responses: {}
      summary: Create a new group
      tags:
      - Groups
  /api/v1/group/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a group by ID
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses: {}
      summary: Delete a group
      tags:
      - Groups
    get:
      consumes:
      - application/json
      description: Get a specific group by its ID
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GroupResponseDTO'
      summary: Get group by ID
      tags:
      - Groups
    patch:
      consumes:
      - application/json
      description: Update an existing group
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated group data
        in: body
        name: group
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateGroupDTO'
      produces:
      - application/json
      responses: {}
      summary: Update a group
      tags:
      - Groups
  /api/v1/group/assign-roles:
    post:
      consumes:
      - application/json
      description: Assign one or more roles to a group
      parameters:
      - description: Role assignment data
        in: body
        name: roles
        required: true
        schema:
          $ref: '#/definitions/dto.AssignRolesToGroupDTO'
      produces:
      - application/json
      responses: {}
      summary: Assign roles to group
      tags:
      - Groups
  /api/v1/group/unassign-roles:
    post:
      consumes:
      - application/json
      description: Remove one or more roles from a group
      parameters:
      - description: Role unassignment data
        in: body
        name: roles
        required: true
        schema:
          $ref: '#/definitions/dto.UnassignRoleFromGroupDTO'
      produces:
      - application/json
      responses: {}
      summary: Unassign roles from group
      tags:
      - Groups
  /api/v1/product:
    get:
      consumes:
      - application/json
      description: Get a paginated list of products with optional filtering
      parameters:
      - description: Page number
        in: query
        name: pageNumber
        type: integer
      - description: Page size
        in: query
        name: pageSize
        type: integer
      - description: From date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: To date (YYYY-MM-DD)
        in: query
        name: to
        type: string
      - description: Search term
        in: query
        name: search
        type: string
      - description: Filter by availability
        in: query
        name: isAvailable
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.PaginationResponse'
      summary: Get all products
      tags:
      - products
    post:
      consumes:
      - application/json
      description: Create a new product with the provided details
      parameters:
      - description: Product object
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/dto.CreateProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Product'
      summary: Create a new product
      tags:
      - products
