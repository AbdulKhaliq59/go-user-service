      - application/json
      description: Toggle the availability of a product (soft delete)
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProductResponse'
      summary: Delete a product
      tags:
      - products
    get:
      consumes:
      - application/json
      description: Get a product by its ID
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Product'
      summary: Get a product by ID
      tags:
      - products
    patch:
      consumes:
      - application/json
      description: Update a product with the provided details
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Product object
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/models.Product'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProductResponse'
      summary: Update a product
      tags:
      - products
  /api/v1/product/assign-bonus/{productId}:
    post:
      consumes:
      - application/json
      description: Assign bonus products to a specific product
      parameters:
      - description: Product ID
        in: path
        name: productId
        required: true
        type: string
      - description: Bonus Product IDs
        in: body
        name: bonusProducts
        required: true
        schema:
          $ref: '#/definitions/dto.BonusProductDTO'
      produces:
      - application/json
      responses:
        "200":
